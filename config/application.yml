farmhand:
  parser_filters:
    always_include:
      assets:
        - "*[Pp]review*.dds"
        - "*[Pp]review*.png"
        - "*[Oo]verview*.dds"
        - "*[Oo]verview*.png"
        - "ui/*.dds"
        - "ui/*.png"
        - "textures/ui/*.dds"
        - "textures/ui/*.png"
        - "map[Ii]con*.dds"
        - "map[Ii]con*.png"
        - "PDA.dds"
        - "PDA.png"
      xml:
        - "config/*.xml"
        - "xml/*.xml" # Some maps (i.e. Pallegney) store XML in /xml
        - "xmlFiles/*.xml"
        - "maps/*.xml"
        - "map.xml"
        - "map*.xml"
        - "CYLNH.xml" # required for specific map 'Castile And Leon'
      grle_data:
        - "data/*.grle"
      map:
        - "map.i3d"
        - "map*.i3d"
        - "map_*.i3d"
      mod:
        - "modDesc.xml"
        - "icon_*.dds"

    # Specific filenames to exclude even if they match an always_include pattern.
    # Use for files that contain no useful map data (e.g. trafficSystems, Trains, etc.)
    excluded_files:
      - "trafficSystem.xml"
      - "aiSystem.xml"
      - "animatedObjects.xml"
      - "footballField.xml"
      - "handTools.xml"
      - "motionPathEffects.xml"
      - "pedestrianSystem.xml"
      - "colorGradingNight.xml"
      - "colorGrading.xml"
      - "collectibles.xml"
      - "licensePlatesFR.i3d"
      - "licensePlatesDE.i3d"
      - "licensePlates.i3d"
      - "sounds.i3d"
      - "decoFoliageEU.xml"
      - "decoFoliageUS.xml"

  extra_content:
    # Vehicles & Equipment
    - "vehicles"
    - "equipment"
    - "buy"

    # Placeables & structures
    - "placeables"
    - "customsPlaceables"
    - "sellpoints"

    # Extra crops / goods
    - "pallets"

    # Misc
    - "icons"

    # crops
    - "foliage"
    - "huds"
